---
layout: default
---
<article class="project-devlog">
    <header>
        <h1>{{ page.title }}</h1>
        {% if page.start_date %}
          <time datetime="{{ page.start_date | date_to_xmlschema }}">
              {{ page.start_date | date: "%A, %B %-d, %Y" }}
          </time>
        {% endif %}
    </header>
    <div class="post-content">
        {{ content }}
    </div>
    <p><a href="{{ '/projects/' | relative_url }}">← Back to the projects.</a></p>
</article>
