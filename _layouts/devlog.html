---
layout: default
---
<article class="project-devlog">
    <header>
        <h1>{{ page.title }}</h1>
        <time datetime="{{ page.date | date_to_xmlschema }}">
            {{ page.date | date: "%A, %B %-d, %Y" }}
        </time>
    </header>
    <div class="post-content">
        {{ content }}
    </div>
    <p><a href="{{ '/projects/' | relative_url }}">← Back to the blog</a></p>
</article>
