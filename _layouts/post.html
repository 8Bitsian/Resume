---
layout: default
---
<article class="blog-post">
  <header>
    <h1>{{ page.title }}</h1>
    <time datetime="{{ page.date | date_to_xmlschema }}">
      {{ page.date | date: "%A, %B %-d, %Y" }}
    </time>
  </header>
  <div class="post-content">
    {{ content }}
  </div>
  <p><a href="{{ '/blog/' | relative_url }}">← Back to the blog</a></p>
</article>
