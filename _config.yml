# Jekyll Theme
remote_theme: pages-theme/cayman@latest

# Site Configuration
title: "Your Site Title"
heading: "Your Name"
description: "A breif description of your website."
url: "https://8bitsian.github.io"
baseurl: "/8BitSoftware.github.io"

# Preferences
preferences:
  - homepage:
      emabled: false
  - search:
      emabled: true
  - backlinks:
      emabled: true
  - pagepreview:
      emabled: true
  - wiki_style_link:
      emabled: true

# Defaults
defaults:
  - scope:
      path: ""
      type: "notes"
    values:
      layout: "Post"
      content-type: "notes"
      feed: "show"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "Post"
      content-type: "post"
      feed: "show"
      permalink: /blog/:title/

# Menu Items
menu:
  - title: "About"
    url: "/about"
  - title: "Projects"
    url: "/projects"
  - title: "Development"
    url: "/devlog"

# Footer
footer:
  copyright: "© 2026 Imani Hollie | Contents under CC-BY-NC "
  credits:
    enabled: true
    url: "/credits/"
    text: "Credits"

# Plugins
plugins:
  - jekyll-remote-theme
  - jekyll-sitemap
  - jekyll-feed

# Configuration
titles_from_headings:
  enabled:     true
  strip_title: false
  collections: false

# Include in Jekyll processing
include:
  - docs

# MathJax
katex: true

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
