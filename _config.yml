# Theme
remote_theme: pages-theme/cayman@latest

# Site Configuration
title: "Your Site Title"
heading: "Your Name"
description: "A breif description of your website."
url: "https://yoursite.com"
baseurl: ""

# Menu Items
menu:
  - title: "About"
    url: "/about"
  - title: "Projects"
    url: "/projects"
  - title: "Development"
    url: "/devlog"

# Footer
footer:
  copyright: "© 2026 Imani Hollie | Contents under CC-BY-NC "
  credits:
    enabled: true
    url: "/credits"
    text: "Credits"

# Plugins
plugins:
  - jekyll-remote-theme
  - jekyll-sitemap
  - jekyll-archives
  - jekyll-feed
  - jekyll-youtube

# Configuration
titles_from_headings:
  enabled:     true
  strip_title: false
  collections: false
