# Theme
remote_theme: pages-theme/cayman@latest

# Site Configuration
title: "Your Site Title"
heading: "Your Name"
description: "A breif description of your website."
url: "https://8bitsian.github.io"
baseurl: "/8BitSoftware.github.io"

# Defaults
defaults:
  - scope:
    path: "docs/pages/index.md"
  - values:
    - permalink: /

# Menu Items
menu:
  - title: "About"
    url: "/about/"
  - title: "Projects"
    url: "/projects/"
  - title: "Development"
    url: "/devlog/"

# Footer
footer:
  copyright: "© 2026 Imani Hollie | Contents under CC-BY-NC "
  credits:
    enabled: true
    url: "/credits/"
    text: "Credits"

# Plugins
plugins:
  - jekyll-remote-theme
  - jekyll-sitemap
  - jekyll-feed

# Configuration
titles_from_headings:
  enabled:     true
  strip_title: false
  collections: false

include:
  - docs
